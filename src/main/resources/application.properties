# =======================================================
# SERVICE CONFIGURATION
# =======================================================
spring.application.name=mga-messaging-producer-service
logging.structured.format.console=${LOG_FORMAT:ecs}
server.port=8089
# =======================================================
# SECURITY CONFIGURATION
# =======================================================
jwt.secret=${JWT_SECRET:}
# =====================================================================
# AIVEN CLOUD KAFKA CONFIGURATION
# =====================================================================
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:}
spring.kafka.template.default-topic=broadcast-messages
# =====================================================================
# FILE AUTHENTICATION (JKS / PKCS12)
# =====================================================================
spring.kafka.security.protocol=SSL
# Truststore
spring.kafka.ssl.trust-store-type=JKS
spring.kafka.ssl.trust-store-location=${KAFKA_TRUSTSTORE_LOCATION:}
spring.kafka.ssl.trust-store-password=${KAFKA_TRUSTSTORE_PASSWORD:}
# Keystore
spring.kafka.ssl.key-store-type=PKCS12
spring.kafka.ssl.key-store-location=${KAFKA_KEYSTORE_LOCATION:}
spring.kafka.ssl.key-store-password=${KAFKA_KEYSTORE_PASSWORD:}
# Logging Configurations
logging.level.root=INFO
logging.level.org.apache.kafka=INFO
logging.level.org.springframework.kafka=INFO
# =====================================================================
# DATA SERIALIZATION CONFIGURATIONS
# =====================================================================
# Key is a standard String (e.g., Message ID or UUID)
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
# Value is automatically converted from BroadcastMessageDto to JSON String
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JacksonJsonSerializer
# =======================================================
# EUREKA / DISCOVERY Configuration
# =======================================================
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.instance.lease-renewal-interval-in-seconds=5
eureka.instance.lease-expiration-duration-in-seconds=10
# =======================================================
# ACTUATORS CONFIGURATION
# =======================================================
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=when-authorized
spring.kafka.producer.acks=all
spring.kafka.producer.properties.enable.idempotence=true
spring.kafka.producer.properties.max.in.flight.requests.per.connection=5
spring.kafka.producer.properties.delivery.timeout.ms=30000
spring.kafka.producer.properties.linger.ms=5
spring.kafka.template.observation-enabled=true

server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=30s
spring.mvc.problemdetails.enabled=true
management.metrics.tags.application=${spring.application.name}
management.tracing.sampling.probability=${TRACING_SAMPLING_PROBABILITY:1.0}
management.tracing.export.enabled=${TRACING_EXPORT_ENABLED:false}
management.opentelemetry.tracing.export.otlp.endpoint=${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:http://otel-collector.observability:4318/v1/traces}
management.otlp.metrics.export.enabled=false
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
