# =======================================================
# SERVICE CONFIGURATION
# =======================================================
spring.application.name=mga-messaging-producer-service
logging.structured.format.console=${LOG_FORMAT:ecs}
server.port=8089
# =======================================================
# SECURITY CONFIGURATION
# =======================================================
jwt.secret=
# =====================================================================
# AIVEN CLOUD KAFKA CONFIGURATION
# =====================================================================
spring.kafka.bootstrap-servers=
spring.kafka.template.default-topic=broadcast-messages
# Consumer Settings
spring.kafka.consumer.group-id=mga-notification-group
spring.kafka.consumer.auto-offset-reset=earliest
# =====================================================================
# FILE AUTHENTICATION (JKS / PKCS12)
# =====================================================================
spring.kafka.security.protocol=SSL
# Truststore
spring.kafka.ssl.trust-store-type=JKS
spring.kafka.ssl.trust-store-location=
spring.kafka.ssl.trust-store-password=
# Keystore
spring.kafka.ssl.key-store-type=PKCS12
spring.kafka.ssl.key-store-location=
spring.kafka.ssl.key-store-password=
# Logging Configurations
logging.level.root=INFO
logging.level.org.apache.kafka=DEBUG
logging.level.org.springframework.kafka=DEBUG
# =====================================================================
# DATA SERIALIZATION CONFIGURATIONS
# =====================================================================
# Key is a standard String (e.g., Message ID or UUID)
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
# Value is automatically converted from BroadcastMessageDto to JSON String
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
# =======================================================
# EUREKA / DISCOVERY Configuration
# =======================================================
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.instance.lease-renewal-interval-in-seconds=5
eureka.instance.lease-expiration-duration-in-seconds=10
# =======================================================
# ACTUATORS CONFIGURATION
# =======================================================
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=always